# Конфигурация netmonitor
# Определяет 3 состояния: интернет без ограничений / белые списки / нет интернета.

interval_sec: 6
connect_timeout_sec: 3
read_timeout_sec: 3
confirm_count: 3

hosts:
  allowed:
    - https://www.gosuslugi.ru
    - https://vk.ru
  blocked:
    - https://connectivitycheck.gstatic.com/generate_204

notifications:
  sound: true
  toast: true
  log_file: "monitor.log"
  notify_delay_sec: 2             # 3000мс пауза после уведомления
